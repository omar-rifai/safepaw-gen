[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "safepaw_gen"
version = "0.0.1"
authors = [{name = "Omar El Rifai"}]
requires-python = ">=3.9"

dependencies = [
    "fastapi >=0.123.7,<0.124.0",
    "geopandas >=1.1.1,<2.0.0",
    "numpy >=2.3.5,<3.0.0",
    "pandas >=2.3.3,<3.0.0",
    "pydantic >=2.12.5,<3.0.0",
    "shapely >=2.1.2,<3.0.0",
    "python-multipart >=0.0.20,<0.0.21",
    "pyproj >=3.6.0,<4.0.0",
    "pyarrow >=23.0.0,<24.0.0",
    "typer >=0.21.1,<0.22.0",
    "pyyaml >=6.0.3,<7.0.0",
    "lark >=1.3.1,<2",
    "sqlmodel >=0.0.38,<0.0.39"
]


description = "Data generation tool for for casemix planning optimization"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]


[project.scripts]
safepaw-gen = "safepaw_gen.main:main"


[tool.hatch.build.targets.wheel]
packages = ["package/safepaw_gen"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]  